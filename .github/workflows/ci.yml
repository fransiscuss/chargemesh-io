name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chargemesh
          POSTGRES_PASSWORD: chargemesh
          POSTGRES_DB: chargemesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chargemesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
      - name: Lint workflows (actionlint)
        run: |
          curl -sSL -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar xz -C /tmp -f /tmp/actionlint.tar.gz actionlint
          /tmp/actionlint
      - name: Apply migrations twice (idempotency)
        env:
          DATABASE_URL: postgres://chargemesh:chargemesh@localhost:5432/chargemesh
        run: |
          pnpm db:migrate
          pnpm db:migrate
