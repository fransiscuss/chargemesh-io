name: SteVe simulator smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-session:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: docker compose --profile qa up -d steve
      - run: bash scripts/steve-smoke.sh
      - name: SteVe logs
        if: always()
        run: docker compose logs --tail 100 steve steve-db
      - name: Stop QA containers
        if: always()
        run: docker compose --profile qa down
