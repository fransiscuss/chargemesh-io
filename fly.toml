app = "chargemesh-gw"

[env]
PORT = "8080"

[processes]
gateway = "node apps/gateway/dist/main.js"
worker = "node apps/gateway/dist/worker.js"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1
processes = ["gateway"]

[[http_service.checks]]
interval = "10s"
timeout = "2s"
grace_period = "5s"
method = "GET"
protocol = "http"
path = "/healthz"

[[services]]
protocol = "tcp"
internal_port = 50051
processes = ["gateway"]

[[services.ports]]
port = 50051
handlers = ["tls"]

[services.tls_options]
alpn = ["h2"]

[deploy]
release_command = "node packages/db/dist/migrate.js"
